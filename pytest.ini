[pytest]
# PyTest configuration for CardForge
minversion = 7.0

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=cardforge
    --cov-report=term-missing
    --cov-report=html
    --cov-branch

# Test markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower)
    slow: Slow tests (>1 second)
    api: Tests requiring external APIs
    database: Database-related tests
    agent: Agent/LLM-related tests
    gui: GUI tests (requires display)

# Coverage configuration
[coverage:run]
branch = True
source = cardforge
omit =
    */tests/*
    */test_*.py
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
precision = 2
