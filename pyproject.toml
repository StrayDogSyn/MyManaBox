[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cardforge"
version = "2.0.0"
description = "Professional-grade Magic: The Gathering collection management platform with AI-powered deck optimization"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Hunter @ StrayDog Syndications LLC"}
]
keywords = [
    "magic", "mtg", "cards", "collection", "management", 
    "deck-building", "trading", "scryfall", "tcgplayer",
    "moxfield", "mcp", "claude", "ai"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Framework :: AsyncIO",
]

dependencies = [
    # Core
    "python-dotenv>=1.0.0",
    
    # Async HTTP
    "aiohttp>=3.9.0",
    "aiofiles>=23.0.0",
    
    # Database
    "aiosqlite>=0.19.0",
    
    # Data Processing
    "pandas>=2.0.0",
    "pydantic>=2.5.0",
    
    # CLI
    "click>=8.1.0",
    "rich>=13.0.0",
    
    # GUI
    "customtkinter>=5.2.0",
    
    # MCP (Claude Integration)
    "mcp>=1.0.0",
    
    # Utilities
    "httpx>=0.25.0",
    "tenacity>=8.2.0",
    
    # Google Drive (optional but included)
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
]

scraping = [
    # For Card Kingdom and EDHRec scraping
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
]

full = [
    "cardforge[dev,scraping]",
]

[project.urls]
Homepage = "https://github.com/StrayDogSyn/MyManaBox"
Repository = "https://github.com/StrayDogSyn/MyManaBox.git"
Issues = "https://github.com/StrayDogSyn/MyManaBox/issues"

[project.scripts]
cardforge = "cardforge.presentation.cli.main:cli"

[project.gui-scripts]
cardforge-gui = "cardforge.presentation.gui.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cardforge*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | archive
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".venv", "archive"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["archive/", "tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["cardforge/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["cardforge"]
omit = ["cardforge/tests/*", "*/test_*.py"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
mymanabox = "main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | legacy
)/
'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = [
    "legacy/",
    "tests/",
]
